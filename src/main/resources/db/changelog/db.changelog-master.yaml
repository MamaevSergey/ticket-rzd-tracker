databaseChangeLog:
  - changeSet:
      id: 001-initial-schema
      author: tracker
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: chat_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(255)
              - column:
                  name: bot_state
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: temp_session_data
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP

        - createTable:
            tableName: tracking_tasks
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: chat_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_tracking_user
                    references: users(chat_id)
              - column:
                  name: origin_code
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: origin_station_name
                  type: VARCHAR(255)
              - column:
                  name: destination_code
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: destination_station_name
                  type: VARCHAR(255)
              - column:
                  name: departure_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: train_number
                  type: VARCHAR(32)
              - column:
                  name: car_type
                  type: VARCHAR(64)
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: last_checked_at
                  type: TIMESTAMP WITH TIME ZONE

        - createIndex:
            indexName: idx_tracking_tasks_status
            tableName: tracking_tasks
            columns:
              - column:
                  name: status